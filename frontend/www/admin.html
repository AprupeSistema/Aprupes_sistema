<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Administrācija</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div id="app">
        <div id="screen-admin" class="screen active">
            <div class="panel-header">
                <h2>Administrācija</h2>
                <div style="display:flex;align-items:center;gap:8px;">
                    <span id="sync-status" class="sync-status"></span>
                    <span id="cache-countdown" class="cache-countdown"></span>
                    <button id="btn-preload-data" class="btn btn-secondary btn-small btn-offline-cache">📥 Kešot datus</button>
                    <span id="mysql-status" class="mysql-status"></span>
                    <button id="btn-mysql-sync" class="btn btn-primary btn-small">MySQL Sync</button>
                    <button id="btn-admin-logout" class="btn btn-secondary btn-small">Iziet</button>
                </div>
            </div>
            <div class="admin-tabs">
                <button class="tab active" data-tab="users">Lietotāji</button>
                <button class="tab" data-tab="clients">Klienti</button>
                <button class="tab" data-tab="import">Imports</button>
                <button class="tab" data-tab="statistika">Statistika</button>
                <button class="tab" data-tab="mysql">MySQL</button>
            </div>
            <div id="tab-users" class="tab-content active">
                <div class="toolbar">
                    <button id="btn-add-user" class="btn btn-primary" style="width:auto;">+ Pievienot</button>
                </div>
                <div id="users-table" class="table-container"></div>
            </div>
            <div id="tab-clients" class="tab-content">
                <div class="toolbar">
                    <button id="btn-add-client" class="btn btn-primary" style="width:auto;">+ Pievienot klientu</button>
                </div>
                <div id="clients-list" class="card-list"></div>
            </div>
            <div id="tab-import" class="tab-content">
                <div class="import-area">
                    <p>Excel imports (.xlsx)</p>
                    <button id="btn-download-template" class="btn btn-secondary" style="width:auto;margin-bottom:10px;">Lejupielādēt veidni</button>
                    <input type="file" id="excel-file" accept=".xlsx,.xls">
                    <button id="btn-import" class="btn btn-primary">Importēt</button>
                    <p id="import-status" class="status-text"></p>
                </div>
            </div>
            <div id="tab-statistika" class="tab-content">
                <div class="filters">
                    <select id="stat-klient"><option value="">Visi</option></select>
                    <input type="month" id="stat-month">
                    <button id="btn-stat-filter" class="btn btn-primary" style="width:auto;">Filtrēt</button>
                    <button id="btn-stat-export" class="btn btn-secondary" style="width:auto;">Excel</button>
                </div>
                <div class="stats-summary">
                    <div class="stat-card"><h3>Kopā</h3><p id="stat-total">-</p></div>
                    <div class="stat-card"><h3>Vid.temp.</h3><p id="stat-temp">-</p></div>
                    <div class="stat-card"><h3>Atteikumi</h3><p id="stat-refusals">-</p></div>
                </div>
                <div id="stat-chart-container" class="chart-container"></div>
            </div>
            <div id="tab-mysql" class="tab-content">
                <div class="mysql-config">
                    <h3>MySQL konfigurācija</h3>
                    <form id="form-mysql-config">
                        <div class="form-row">
                            <div class="form-group">
                                <label>MySQL Host</label>
                                <input type="text" id="mysql-host" placeholder="piem. localhost" required>
                            </div>
                            <div class="form-group">
                                <label>Ports</label>
                                <input type="number" id="mysql-port" placeholder="3306" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Lietotājs</label>
                                <input type="text" id="mysql-user" placeholder="root" required>
                            </div>
                            <div class="form-group">
                                <label>Parole</label>
                                <input type="password" id="mysql-password" placeholder="MySQL parole">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Datubāzes nosaukums</label>
                            <input type="text" id="mysql-database" placeholder="aprupes_sistema" required>
                        </div>
                        <div class="form-actions">
                            <button type="button" id="btn-test-mysql" class="btn btn-secondary">Pārbaudīt savienojumu</button>
                            <button type="submit" class="btn btn-primary">Saglabāt konfigurāciju</button>
                        </div>
                        <div id="mysql-status-text" class="status-text"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-user" class="modal hidden">
        <div class="modal-content">
            <h2 id="modal-user-title">Lietotājs</h2>
            <form id="form-user">
                <input type="text" id="user-vards" placeholder="Vārds" required>
                <span class="field-error hidden"></span>
                <input type="text" id="user-uzvards" placeholder="Uzvārds" required>
                <span class="field-error hidden"></span>
                <select id="user-loma"><option value="aprupetajs">Aprūpētājs</option><option value="kontrolieris">Kontrole</option><option value="admin">Vadītājs</option></select>
                <input type="text" id="user-pin" placeholder="PIN (6 cipari)" required>
                <span class="field-error hidden"></span>
                <input type="password" id="user-parole" placeholder="Parole" required>
                <span class="field-error hidden"></span>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">Saglabāt</button>
                    <button type="button" id="btn-user-cancel" class="btn btn-secondary">Atcelt</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-client" class="modal hidden">
        <div class="modal-content">
            <h2 id="modal-client-title">Klients</h2>
            <form id="form-client">
                <input type="text" id="client-vards" placeholder="Vārds" required>
                <span class="field-error hidden"></span>
                <input type="text" id="client-uzvards" placeholder="Uzvārds" required>
                <span class="field-error hidden"></span>
                <input type="date" id="client-dzimsana" required>
                <span class="field-error hidden"></span>
                <input type="text" id="client-dieta" placeholder="Diēta">
                <input type="text" id="client-saskarsme" placeholder="Saskarsmes īpatnības">
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">Saglabāt</button>
                    <button type="button" id="btn-client-cancel" class="btn btn-secondary">Atcelt</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/common.js"></script>
    <script src="js/cache.js"></script>
    <script>
        if (!authToken || !currentUser || currentUser.loma !== 'admin') {
            window.location.href = 'index.html';
        }
    </script>
    <script src="js/sqlite.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/care_form.js"></script>
</body>
</html>

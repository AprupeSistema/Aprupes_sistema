<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprūpes sistēma — Iestatīšana</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="card setup-card">
            <h1>Aprūpes sistēmas iestatīšana</h1>
            <p class="setup-subtitle">Pirmajā palaišanas reizē veiciet administratora izveidi.</p>
            <form id="setup-form">
                <div class="form-group">
                    <label for="admin-vards">Vārds</label>
                    <input type="text" id="admin-vards" required>
                </div>
                <div class="form-group">
                    <label for="admin-uzvards">Uzvārds</label>
                    <input type="text" id="admin-uzvards" required>
                </div>
                <div class="form-group">
                    <label for="admin-pin">PIN (6 cipari)</label>
                    <input type="text" id="admin-pin" maxlength="6" required>
                </div>
                <div class="form-group">
                    <label for="admin-parole">Parole</label>
                    <input type="password" id="admin-parole" required>
                </div>
                <button type="submit" class="btn btn-primary">Izveidot administratoru</button>
            </form>
            <div id="setup-error" class="error-message"></div>
            <div id="setup-success" class="success-message"></div>
        </div>
    </div>
    <script src="js/common.js"></script>
    <script>
        async function checkSetup() {
            try {
                const data = await apiGet('/setup/status');
                if (data.setup_complete) {
                    window.location.href = 'index.html';
                }
            } catch (e) {
                console.error('Setup check failed:', e);
            }
        }

        document.getElementById('setup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('setup-error');
            const successEl = document.getElementById('setup-success');
            errorEl.textContent = '';
            successEl.textContent = '';

            const payload = {
                vards: document.getElementById('admin-vards').value.trim(),
                uzvards: document.getElementById('admin-uzvards').value.trim(),
                pin: document.getElementById('admin-pin').value.trim(),
                parole: document.getElementById('admin-parole').value
            };

            try {
                const res = await apiPost('/setup/admin', payload);
                if (res.status === 'ok') {
                    successEl.textContent = 'Administrators izveidots. Tikko tiksiet pāradresēts...';
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    errorEl.textContent = res.message || 'Kļūda iestatīšanā';
                }
            } catch (err) {
                errorEl.textContent = err.message || 'Kļūda iestatīšanā';
            }
        });

        checkSetup();
    </script>
</body>
</html>

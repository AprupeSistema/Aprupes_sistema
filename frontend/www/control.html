<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kontrole</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/control.css">
</head>
<body>
    <div id="app">
        <div id="screen-control" class="screen active">
            <div class="panel-header">
                <h2>Kontrole</h2>
                <div style="display:flex;align-items:center;gap:8px;">
                    <span id="sync-status" class="sync-status"></span>
                    <span id="cache-countdown" class="cache-countdown"></span>
                    <button id="btn-preload-data" class="btn btn-secondary btn-small btn-offline-cache">📥 Kešot datus</button>
                    <button id="btn-control-logout" class="btn btn-secondary btn-small">Iziet</button>
                </div>
            </div>
            
            <div class="panel-content">
                <div class="date-selector">
                    <button class="btn btn-secondary btn-small active" onclick="setControlPeriod('today')">Šodien</button>
                    <button class="btn btn-secondary btn-small" onclick="setControlPeriod('yesterday')">Vakar</button>
                    <button class="btn btn-secondary btn-small" onclick="setControlPeriod('week')">Šī nedēļa</button>
                    <button class="btn btn-secondary btn-small" onclick="setControlPeriod('month')">Šis mēnesis</button>
                    <input type="date" id="control-custom-date" onchange="loadControlDashboard()">
                </div>
                
                <div id="dashboard-content">
                    <div class="stats-overview">
                        <div class="stat-card"><h3>👥 Kopā klienti</h3><p class="big-number" id="stat-total-clients">0</p></div>
                        <div class="stat-card"><h3>✅ Aprūpe pabeigta</h3><p class="stat-success" id="stat-completed">0</p></div>
                        <div class="stat-card"><h3>🔴 Nav veikta</h3><p class="stat-danger" id="stat-not-started">0</p></div>
                        <div class="stat-card"><h3>⚠️ Nepilnīgi</h3><p class="stat-warning" id="stat-incomplete">0</p></div>
                    <div class="stat-card"><h3>👨‍⚕️ Aktīvie aprūpētāji</h3><p class="big-number" id="stat-active-caregivers">0</p></div>
                    <div class="stat-card"><h3>🍼 Autiņbikšu maiņas</h3><p class="big-number" id="stat-diaper-changes">0</p></div>
                </div>
                
                <div class="dashboard-grid">
                    <div class="client-list-section">
                        <h3>Kas nav izdarīts?</h3>
                        <div class="quick-filters">
                            <button class="btn btn-secondary btn-small active" onclick="setClientFilter('all')">Visi</button>
                            <button class="btn btn-secondary btn-small" onclick="setClientFilter('problems')">⚠ Problēmas</button>
                            <button class="btn btn-secondary btn-small" onclick="setClientFilter('not-started')">○ Nav sākti</button>
                            <button class="btn btn-secondary btn-small" onclick="setClientFilter('incomplete')">◐ Nepilnīgi</button>
                            <button class="btn btn-secondary btn-small" onclick="setClientFilter('completed')">✓ Pabeigti</button>
                        </div>
                        <div id="client-list" class="client-list"></div>
                    </div>
                    
                    <div class="detail-section">
                        <div id="client-detail" class="client-detail hidden">
                            <h3 id="detail-client-name">Klients</h3>
                            <div id="detail-content"></div>
                        
                        </div>
                        <div id="client-detail-empty" class="empty-state">
                            <p>Izvēlies klientu, lai redzētu detalizētu informāciju</p>
                        </div>
                    </div>
                </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/common.js"></script>
    <script src="js/cache.js"></script>
    <script>
        if (!authToken || !currentUser || currentUser.loma !== 'kontrolieris') {
            window.location.href = 'index.html';
        }
    </script>
    <script src="js/sqlite.js"></script>
    <script src="js/control.js"></script>
</body>
</html>

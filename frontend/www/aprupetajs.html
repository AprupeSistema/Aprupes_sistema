<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aprūpētājs</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/aprupetajs.css">
</head>
<body>
    <div id="app">
        <div id="screen-aprupetajs" class="screen active">
            <div class="panel-header">
                <h2 id="aprupetajs-name">Aprūpētājs</h2>
                <div style="display:flex;align-items:center;gap:8px;">
                    <span id="sync-status" class="sync-status"></span>
                    <span id="cache-countdown" class="cache-countdown"></span>
                    <button id="btn-preload-data" class="btn btn-secondary btn-small btn-offline-cache">📥 Kešot datus</button>
                    <button id="btn-logout" class="btn btn-secondary btn-small">Iziet</button>
                </div>
            </div>
            <div class="panel-content">
                <div id="today-summary" class="today-summary"></div>
                <div class="filters">
                    <input type="text" id="client-search" placeholder="Meklēt pēc vārda/uzvārda..." style="flex:1;padding:10px;border:1px solid var(--border);border-radius:8px;">
                    <select id="client-sort">
                        <option value="vards">Pēc vārda</option>
                        <option value="vecums">Pēc vecuma</option>
                        <option value="dieta">Pēc diētas</option>
                        <option value="status">Pēc statusa</option>
                    </select>
                </div>
                <div class="client-grid" id="client-grid"></div>
            </div>
        </div>
        
        <div id="screen-client-detail" class="screen">
            <div class="form-header">
                <h2 id="detail-client-name">Klients</h2>
                <span id="detail-date" class="meta"></span>
                <button id="btn-detail-back" class="btn btn-secondary btn-small">Atpakaļ</button>
            </div>
            
            <div class="detail-content">
                <div class="temp-card" id="temp-card">
                    <div class="temp-icon">🌡️</div>
                    <div class="temp-info">
                        <div class="temp-label">Temperatūra</div>
                        <div class="temp-value" id="temp-value-display">—</div>
                        <div class="temp-status" id="temp-status-display"></div>
                    </div>
                    <button class="btn btn-secondary btn-small" onclick="showTempInput()">Ievadīt</button>
                </div>
                
                <div id="temp-input-area" class="temp-input-area hidden">
                    <input type="number" step="0.1" id="temp-input" class="input-number" placeholder="°C">
                    <button class="btn btn-primary btn-small" onclick="saveTemp()">Saglabāt</button>
                    <button class="btn btn-secondary btn-small" onclick="hideTempInput()">Atcelt</button>
                </div>
                
                <div class="blocks-grid">
                    <div class="block-card" data-block="hygiene" onclick="showBlockActions('hygiene')">
                        <div class="block-icon">🧼</div>
                        <div class="block-title">Higiēna</div>
                        <div class="block-hint" id="hygiene-hint">Nav veikts</div>
                    </div>
                    
                    <div class="block-card" data-block="meals" onclick="showMealBlock()">
                        <div class="block-icon">🍽️</div>
                        <div class="block-title">Ēdināšana</div>
                        <div class="block-hint" id="meals-hint">Nav veikts</div>
                        <div id="current-meal-hint" class="hidden" style="font-size: 11px; color: var(--primary); margin-top: 4px;"></div>
                    </div>
                    
                    <div class="block-card" data-block="fluids" onclick="showBlockActions('fluids')">
                        <div class="block-icon">💧</div>
                        <div class="block-title">Šķidrums</div>
                        <div class="block-hint" id="fluids-hint">0 ml</div>
                    </div>
                    
                    <div class="block-card" data-block="physiology" onclick="showBlockActions('physiology')">
                        <div class="block-icon">🚻</div>
                        <div class="block-title">Fizioloģija</div>
                        <div class="block-hint" id="physiology-hint">Nav veikts</div>
                    </div>
                    
                    <div class="block-card" data-block="activity" onclick="showBlockActions('activity')">
                        <div class="block-icon">🚶</div>
                        <div class="block-title">Aktivitāte</div>
                        <div class="block-hint" id="activity-hint">Nav veikts</div>
                    </div>
                    
                    <div class="block-card" data-block="pastaiga" onclick="showBlockActions('pastaiga')">
                        <div class="block-icon">🚶</div>
                        <div class="block-title">Pastaiga</div>
                        <div class="block-hint" id="pastaiga-hint">Nav veikts</div>
                    </div>
                    
                    <div class="block-card" data-block="ciemini" onclick="showBlockActions('ciemini')">
                        <div class="block-icon">👥</div>
                        <div class="block-title">Ciemiņi</div>
                        <div class="block-hint" id="ciemini-hint">Nav veikts</div>
                    </div>
                    
                    <div class="block-card" data-block="autins_biksitu" onclick="showBlockActions('autins_biksitu')">
                        <div class="block-icon">🍼</div>
                        <div class="block-title">Autiņbikšu maiņa</div>
                        <div class="block-hint" id="autins-hint">Nav veikts</div>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button id="btn-save-care" class="btn btn-primary">Saglabāt</button>
                    <button id="btn-sign-care" class="btn btn-secondary">Parakstīties</button>
                    <button id="btn-back-care" class="btn btn-secondary">Atpakaļ</button>
                </div>
                
                <div class="signature-section" id="signature-section">
                    <label>Paraksts:</label>
                    <span id="caregiver-signature" class="signature-text"></span>
                </div>
            </div>
        </div>
        
        <div id="screen-block-actions" class="screen">
            <div class="form-header">
                <h2 id="block-title">Darbības</h2>
                <button id="btn-block-back" class="btn btn-secondary btn-small">Atpakaļ</button>
            </div>
            
            <div class="block-actions-content" id="block-actions-content">
            </div>
        </div>
        
        <div id="modal-confirm" class="modal hidden">
            <div class="modal-content" style="max-width:400px;">
                <h3 id="modal-confirm-title">Apstiprinājums</h3>
                <p id="modal-confirm-text"></p>
                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="hideModal('modal-confirm')">Atcelt</button>
                    <button class="btn btn-primary" id="modal-confirm-btn">Apstiprināt</button>
                </div>
            </div>
        </div>
        
        <div id="modal-edit" class="modal hidden">
            <div class="modal-content" style="max-width:400px;">
                <h3>Labot ierakstu</h3>
                <div id="modal-edit-content"></div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="hideModal('modal-edit')">Atcelt</button>
                    <button class="btn btn-primary" id="modal-edit-save">Saglabāt</button>
                </div>
            </div>
        </div>
        
        <div id="modal-summary" class="modal hidden">
            <div class="modal-content" style="max-width:600px;">
                <h3 id="modal-summary-title"></h3>
                <div id="modal-summary-body"></div>
                <button class="btn btn-secondary" onclick="hideModal('modal-summary')">Aizvērt</button>
            </div>
        </div>
    </div>
    
    <script src="js/common.js"></script>
    <script src="js/cache.js"></script>
    <script>
        if (!authToken || !currentUser || currentUser.loma !== 'aprupetajs') {
            window.location.href = 'index.html';
        }
    </script>
    <script src="js/sqlite.js"></script>
    <script src="js/aprupetajs.js"></script>
    <script src="js/care_form.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2c3e50">
  <title>Aprūpes forma</title>
  <link rel="stylesheet" href="css/aprupetajs.css">
  <link rel="icon" href="logo/logoDS.png" type="image/png">
</head>
<body>
  <header class="header">
    <button id="backBtn" class="btn-icon">←</button>
    <h1 id="clientName">...</h1>
    <span id="syncStatus" class="sync-badge">Saglabāts</span>
  </header>

  <main class="main">
    <section class="client-info-card" id="clientInfoCard">
      <div class="client-info-main">
        <div class="client-info-name" id="clientName2">...</div>
        <div class="client-info-meta" id="clientDob"></div>
      </div>
      <div class="client-info-tags">
        <span class="info-tag" id="clientDiet">-</span>
        <span class="info-tag" id="clientSaskarsme">-</span>
      </div>
    </section>

    <div class="shift-tabs">
      <button class="shift-tab active" data-shift="R">
        <span class="shift-icon">☀️</span>
        <span>Rīts</span>
      </button>
      <button class="shift-tab" data-shift="V">
        <span class="shift-icon">🌙</span>
        <span>Vakars</span>
      </button>
    </div>

    <div id="formContainer" class="form-container">
      <div class="loading">Ielādēju formu...</div>
    </div>

    <div class="signature-card">
      <div class="signature-card-left">
        <div class="signature-card-title">Aprūpētāja paraksts</div>
        <div class="signature-card-info" id="signedBy" style="display:none;"></div>
      </div>
      <button id="signBtn" class="sign-btn">Parakstīties</button>
    </div>

    <div class="history-card">
      <div class="history-card-header">
        <h3>📜 Šodienas vēsture</h3>
      </div>
      <div id="historyContainer" class="history-container">
        <div class="loading">Nav ierakstu</div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/care_form.js"></script>
</body>
</html>

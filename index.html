<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2c3e50">
  <title>Aprūpes sistēma – Ienākšana</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="icon" href="logo/logoDS.png" type="image/png">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <img src="logo/logoDS.png" alt="Aprūpes sistēma" class="login-logo">
      <h1>Aprūpes sistēma</h1>
      <p>Ievadiet PIN kodu</p>
      <form id="loginForm" autocomplete="off">
        <input type="password" id="pinInput" inputmode="numeric" autocomplete="off" placeholder="PIN __ __" maxlength="6">
        <button type="submit" id="loginBtn">Ieiet</button>
      </form>
      <div id="errorMessage" class="error-message" style="display:none;"></div>
      <div id="statusMessage" class="status-message"></div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
